name: Benchmark Suite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Allow manual dispatch for ad-hoc benchmark runs (e.g. large-grid testing).
  # The large grid is NEVER run by the automated steps below; it is manual only.
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::terra
            any::Rcpp

      - name: Install package
        run: R CMD INSTALL .

      # Runs small (100×100) and medium (1000×1000) grids only.
      # Exits with code 1 — failing the CI step — if:
      #   • small grid median time > 0.1 s, or
      #   • medium grid median time > 1.0 s
      # Large grid (global 0.5°) is NOT run here; use manual dispatch instead.
      - name: Run benchmark suite (small and medium grids)
        run: Rscript benchmarks/run_benchmarks.R
