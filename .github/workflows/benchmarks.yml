name: Benchmark Suite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::terra
            any::Rcpp
          needs: |
            check

      - name: Install package
        run: R CMD INSTALL .

      - name: Run benchmarks
        run: Rscript benchmarks/run_benchmarks.R
